<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .card {
        background: linear-gradient(145deg, #ffffff, #f8f9fa);
        border-radius: 1.5rem;
    }
    .card-body h4 {
        color: #2d2d2d;
    }
    .bg-light {
        background-color: #f4f6f9 !important;
    }
  </style>


</head>
<body>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body text-center p-4">
          <h4 class="fw-bold mb-3">
            🔥 Streak & Reward Progress
          </h4>

          <!-- User Info -->
          <div class="mb-3">
            <h5 th:text="${user.fullName}"></h5>
            <p class="text-muted" th:text="'@' + ${user.username}"></p>
          </div>

          <!-- Streak Info -->
          <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-light rounded-3 mb-3">
            <div>
              <h6 class="mb-0">Current Streak</h6>
              <p class="fs-5 fw-bold text-danger mb-0" th:text="${user.streakDays} + ' Days'"></p>
            </div>
            <div>
              <h6 class="mb-0">Streak Weeks</h6>
              <p class="fs-5 fw-bold text-primary mb-0" th:text="${user.streakWeeks} + ' Weeks'"></p>
            </div>
          </div>

          <!-- Points Info -->
          <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-light rounded-3 mb-3">
            <div>
              <h6 class="mb-0">Points per Post</h6>
              <p class="fs-5 fw-bold text-success mb-0" th:text="${user.currentPointsPerPost}"></p>
            </div>
            <div>
              <h6 class="mb-0">Total Points</h6>
              <p class="fs-5 fw-bold text-warning mb-0" th:text="${user.points}"></p>
            </div>
          </div>

          <!-- Last Post Date -->
          <div class="text-muted small">
            <p class="mb-0">
              <i class="bi bi-calendar-check"></i>
              Last Posted:
              <span th:text="${#temporals.format(user.lastPostDate, 'dd MMM yyyy')}"></span>
            </p>
          </div>

          <!-- Optional button -->
          <div class="mt-3">
            <a href="/user/dashboard" class="btn btn-outline-primary rounded-pill">
              View My Posts
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
