<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Rate Pictures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .signup-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .signup-body::-webkit-scrollbar {
            width: 6px;
        }

        .signup-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .signup-body::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-control {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-control.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .otp-section {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .otp-section .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-send-otp {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-send-otp:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-send-otp:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .btn-signup:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 14px;
        }

        .social-login {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-social {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-social:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .success-icon {
            color: #20bf6b;
            margin-left: 5px;
            display: none;
        }

        .success-icon.show {
            display: inline;
        }

        @media (max-width: 576px) {
            .signup-header {
                padding: 30px 20px;
            }

            .signup-header h1 {
                font-size: 24px;
            }

            .signup-body {
                padding: 30px 20px;
            }

            .otp-section {
                flex-direction: column;
                gap: 15px;
            }

            .btn-send-otp {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="signup-container">
    <div class="signup-header">
        <h1>Create Account</h1>
        <p>Sign up to start rating pictures</p>
    </div>

    <div class="signup-body">
        <form id="signupForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
                <div class="error-message" id="usernameError">Username must be at least 3 characters</div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                <div class="error-message" id="emailError">Please enter a valid email</div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Email OTP
                    <span class="success-icon" id="otpSuccess">✓</span>
                </label>
                <div class="otp-section">
                    <div class="form-group">
                        <input type="text" id="otp" class="form-control" placeholder="Enter OTP" maxlength="6" disabled>
                        <div class="error-message" id="otpError">Invalid OTP</div>
                    </div>
                    <button type="button" class="btn-send-otp" id="sendOtpBtn">Send OTP</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Create Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                <div class="error-message" id="passwordError">Password must be at least 8 characters</div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                <div class="error-message" id="confirmPasswordError">Passwords do not match</div>
            </div>

            <button type="submit" class="btn-signup" id="signupBtn" disabled>Sign Up</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="social-login">
            <a class="btn-social text-dark text-decoration-none" href="/oauth2/authorization/google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google
            </a>
            <a href="/oauth2/authorization/instagram" class="btn-social btn-social text-decoration-none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#E4405F">
                    <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm5.25-.88a1.13 1.13 0 1 1 0 2.26 1.13 1.13 0 0 1 0-2.26z"/>
                </svg>
                Instagram
            </a>


        </div>

        <div class="links">
            Already have an account? <a href="/login" >Login</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const otp = document.getElementById('otp');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const signupBtn = document.getElementById('signupBtn');
    const otpSuccess = document.getElementById('otpSuccess');

    let otpSent = false;
    let otpVerified = false;
    let generatedOtp = '';

    // Email validation
    email.addEventListener('blur', function() {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(this.value)) {
            this.classList.add('error');
            document.getElementById('emailError').classList.add('show');
        } else {
            this.classList.remove('error');
            document.getElementById('emailError').classList.remove('show');
        }
    });

    // Username validation
    username.addEventListener('blur', function() {
        if (this.value.length < 3) {
            this.classList.add('error');
            document.getElementById('usernameError').classList.add('show');
        } else {
            this.classList.remove('error');
            document.getElementById('usernameError').classList.remove('show');
        }
    });

    // Password validation
    password.addEventListener('blur', function() {
        if (this.value.length < 8) {
            this.classList.add('error');
            document.getElementById('passwordError').classList.add('show');
        } else {
            this.classList.remove('error');
            document.getElementById('passwordError').classList.remove('show');
        }
    });

    // Confirm password validation
    confirmPassword.addEventListener('input', function() {
        if (this.value !== password.value) {
            this.classList.add('error');
            document.getElementById('confirmPasswordError').classList.add('show');
        } else {
            this.classList.remove('error');
            document.getElementById('confirmPasswordError').classList.remove('show');
        }
        checkFormValidity();
    });

    // Send OTP
    sendOtpBtn.addEventListener('click', function() {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.value)) {
            alert('Please enter a valid email first');
            email.focus();
            return;
        }

        // Simulate OTP generation (in real app, this would be sent to backend)
        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
        console.log('Generated OTP:', generatedOtp); // In real app, this would be sent via email

        alert(`OTP sent to ${email.value}!\n\nFor demo purposes, your OTP is: ${generatedOtp}`);

        otp.disabled = false;
        otpSent = true;
        sendOtpBtn.textContent = 'Resend OTP';
        sendOtpBtn.disabled = true;

        // Enable resend after 30 seconds
        let countdown = 30;
        const interval = setInterval(() => {
            countdown--;
            sendOtpBtn.textContent = `Resend (${countdown}s)`;
            if (countdown <= 0) {
                clearInterval(interval);
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Resend OTP';
            }
        }, 1000);
    });

    // Verify OTP
    otp.addEventListener('input', function() {
        if (this.value.length === 6) {
            if (this.value === generatedOtp) {
                this.classList.remove('error');
                document.getElementById('otpError').classList.remove('show');
                otpVerified = true;
                otpSuccess.classList.add('show');
                this.disabled = true;
                sendOtpBtn.disabled = true;
                checkFormValidity();
            } else {
                this.classList.add('error');
                document.getElementById('otpError').classList.add('show');
                otpVerified = false;
            }
        }
    });

    // Check form validity
    function checkFormValidity() {
        const isValid = username.value.length >= 3 &&
                      email.value.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/) &&
                      otpVerified &&
                      password.value.length >= 8 &&
                      confirmPassword.value === password.value;

        signupBtn.disabled = !isValid;
    }

    // Monitor all inputs
    [username, email, password, confirmPassword].forEach(input => {
        input.addEventListener('input', checkFormValidity);
    });

    // Form submission
    document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const userData = {
            username: username.value,
            email: email.value,
            password: password.value
        };

        // Here you would typically send the data to your backend
        console.log('Sign up data:', userData);

        alert('Account created successfully! Redirecting to login...');
        // window.location.href = 'login.html';
    });
</script>
</body>
</html>
